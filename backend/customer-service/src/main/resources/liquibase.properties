# --- Base cible (PostgreSQL local) ---
driver=org.postgresql.Driver
url=jdbc:postgresql://localhost:5432/customer
username=db-shop-user
#password=

# --- Base de référence = tes entités JPA ---
referenceDriver=liquibase.ext.hibernate.database.connection.HibernateDriver
referenceUrl=hibernate:spring:io.github.fcazalet.bigshop.customer.model.db?dialect=org.hibernate.dialect.PostgreSQLDialect&hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy&hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Pas de credentials pour la référence Hibernate
referenceUsername=
referencePassword=

# --- Sorties ---
changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml
diffChangeLogFile=src/main/resources/db/changelog/changes/diff-changelog.yaml