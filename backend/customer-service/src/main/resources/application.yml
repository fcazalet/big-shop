server:
  port: 8081
spring:
  output:
    ansi:
      enabled: always
  application:
    name: customer-service
  mvc:
    apiversion:
      use:
        header: API-Version
  jpa:
    hibernate:
      ddl-auto: validate # NEVER CHANGE IT
  datasource:
    url: jdbc:postgresql://localhost:5432/customer
    username: db-shop-user
    password: ${DB_PASSWORD}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    shop:
      issuer: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/shop
      jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/shop/protocol/openid-connect/certs
      audience: shop-api
    keycloak:
      base-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
      realm: shop
      client-id: customer-registration
      client-secret: ${CUSTOMER_REGISTRATION_SECRET}
      verification-client-id: storefront
      verification-redirect-uri: http://localhost:4200/