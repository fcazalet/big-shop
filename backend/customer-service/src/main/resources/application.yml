server:
  port: 8081
  servlet:
    context-path: /api/v1
spring:
  output:
    ansi:
      enabled: always
  application:
    name: customer-service

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    shop:
      issuer: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}/realms/shop
      jwk-set-uri: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}/realms/shop/protocol/openid-connect/certs
      audience: shop-api
    keycloak:
      base-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
      realm: shop
      client-id: customer-registration
      # No default on purpose: the service must fail fast if the secret is missing
      client-secret: ${CUSTOMER_REGISTRATION_SECRET}
      verification-client-id: storefront
      verification-redirect-uri: http://localhost:4200/