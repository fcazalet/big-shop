services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
  global-db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_MULTIPLE_DATABASES: keycloak:keycloak:${KEYCLOAK_DB_PASSWORD},customer:db-shop-user:${SHOP_DB_PASSWORD},catalog:db-shop-user:${SHOP_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    volumes:
      - ./postgresql/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
      - ./postgresql/data:/var/lib/postgresql/data
  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    entrypoint: ["/opt/keycloak/bin/kc.sh"]
    command: ["start-dev", "--import-realm"] # Dev mode, chage to start form production and HTTPS
    depends_on:
      global-db:
        condition: service_started
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://global-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD missing}
      # Enabling http
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Realm vars
      CUSTOMER_REGISTRATION_SECRET: ${CUSTOMER_REGISTRATION_SECRET:?manquant}
      IDENTITY_SERVICE_SECRET: ${IDENTITY_SERVICE_SECRET:?manquant}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080" # http port
      - "8443:8443" # https port
      - "9000:9000"

  # Development SMTP server
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP